name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up JDK 11 and OpenJFX
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
      - name: Install OpenJFX (if needed by modules)
        run: |
          sudo apt-get update
          sudo apt-get install -y openjfx

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compile Java sources into bin
        run: |
          mkdir -p bin
          javac -d bin \
            --module-path /usr/share/openjfx/lib:lib \
            --add-modules javafx.controls,javafx.fxml,javafx.graphics,javafx.base \
            -cp "lib/*" \
            $(find src -name "*.java")

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
