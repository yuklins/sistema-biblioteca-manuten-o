sonar.projectKey=yuklins_sistema-biblioteca-manuten-o
sonar.organization=yuklins

# Path(s) to compiled .class files (comma-separated if multiple)
sonar.java.binaries=target/classes

# Optional: compiled test .class files (improves test analysis)
sonar.java.test.binaries=target/test-classes

# Path(s) to external dependency JARs (supports wildcards like *.jar)
sonar.java.libraries=lib/*.jar

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=sistema-biblioteca-manuten-o
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
